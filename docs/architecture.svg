<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Rogo Research Agent: request and research flow</title>
<desc id="desc">The React UI sends conversation history to an Express API. A bounded agent loop calls the Anthropic model and executes independent read-only tools in parallel against fictional local data. Research events and answer text stream back to the UI. Stop or disconnect aborts the model request.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#111827;font-size:16px}.sub{font-size:14px;fill:#6b7280}.head{font-size:18px;font-weight:600}.label{font-size:13px}.box{fill:#fff;stroke:#d1d5db;stroke-width:1.5}.data{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#blue)}.loop{fill:none;stroke:#7c3aed;stroke-width:2;marker-end:url(#purple)}.event{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#gray)}</style>
<defs><marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#2563eb"/></marker><marker id="purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#7c3aed"/></marker><marker id="gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="660" fill="#fff"/>
<text x="40" y="42" font-size="26" font-weight="600">Rogo Research Agent</text><text x="40" y="70" class="sub">A bounded research loop over five fictional companies — no external research APIs</text>
<rect x="35" y="120" width="200" height="130" rx="8" class="box"/><path d="M35 145H235" stroke="#d1d5db"/><circle cx="49" cy="133" r="3" fill="#93c5fd"/><circle cx="61" cy="133" r="3" fill="#93c5fd"/><text x="135" y="177" text-anchor="middle" class="head">React chat UI</text><text x="135" y="203" text-anchor="middle" class="sub">Progress · markdown</text><text x="135" y="225" text-anchor="middle" class="sub">Follow-ups · Stop / Retry</text>
<rect x="335" y="120" width="200" height="130" rx="8" class="box"/><text x="435" y="159" text-anchor="middle" class="head">Express API</text><text x="435" y="187" text-anchor="middle" class="sub">POST /api/chat</text><text x="435" y="213" text-anchor="middle" class="sub">Validate + bound history</text>
<rect x="635" y="120" width="220" height="130" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><rect x="640" y="125" width="210" height="120" rx="6" fill="none" stroke="#bfdbfe"/><text x="745" y="159" text-anchor="middle" class="head">Agent loop</text><text x="745" y="187" text-anchor="middle" class="sub">Up to 8 model turns</text><text x="745" y="213" text-anchor="middle" class="sub">Final turn: answer only</text>
<rect x="955" y="120" width="210" height="130" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text x="1060" y="161" text-anchor="middle" class="head">Anthropic model</text><text x="1060" y="189" text-anchor="middle" class="sub">Select tools or answer</text><text x="1060" y="217" text-anchor="middle" class="sub">No extra editor pass</text>
<path d="M235 166H335" class="data"/><text x="285" y="153" text-anchor="middle" class="label">Conversation</text><path d="M535 166H635" class="data"/><text x="585" y="153" text-anchor="middle" class="label">Validated turns</text>
<path d="M855 160H955" class="data"/><text x="905" y="147" text-anchor="middle" class="label">Context + tools</text><path d="M955 219H855" class="loop"/><text x="905" y="242" text-anchor="middle" class="label">Model response</text>
<path d="M745 120V100H435V120" class="event"/><text x="587" y="91" text-anchor="middle" class="label">Lookup events + text + terminal result</text><path d="M335 222H235" class="event"/><text x="285" y="244" text-anchor="middle" class="label">NDJSON</text>
<rect x="635" y="385" width="220" height="135" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="745" y="416" text-anchor="middle" class="head">Read-only tools</text><text x="745" y="443" text-anchor="middle" class="sub">Companies · profiles</text><text x="745" y="466" text-anchor="middle" class="sub">Financials · documents</text><text x="745" y="491" text-anchor="middle" class="sub">Parallel within each turn</text>
<rect x="955" y="385" width="210" height="135" rx="8" class="box"/><text x="1060" y="420" text-anchor="middle" class="head">Local fictional data</text><text x="1060" y="449" text-anchor="middle" class="sub">Deterministic metrics</text><text x="1060" y="477" text-anchor="middle" class="sub">Synthetic quarter warning</text>
<path d="M805 250V385" class="data"/><text x="818" y="345" class="label">Tool calls</text><path d="M675 385V320C675 310 610 310 610 280V210C610 200 620 200 635 200" class="loop"/><text x="590" y="355" text-anchor="end" class="label">Results / recoverable errors</text>
<path d="M855 437H955" class="data"/><text x="905" y="425" text-anchor="middle" class="label">Lookup</text><path d="M955 487H855" class="loop"/><text x="905" y="511" text-anchor="middle" class="label">Data + warnings</text>
<text x="40" y="410" class="head">Cancellation &amp; context</text><text x="40" y="442" class="sub">Stop / disconnect aborts the model request.</text><text x="40" y="469" class="sub">Follow-ups carry prior answers, not old tool results.</text><text x="40" y="496" class="sub">No persistent memory or external research fetches.</text>
<path d="M40 578H85" class="data"/><text x="98" y="583" class="sub">Request / lookup</text><path d="M300 578H345" class="loop"/><text x="358" y="583" class="sub">Response / loop</text><path d="M560 578H605" class="event"/><text x="618" y="583" class="sub">Streaming events</text>
<text x="40" y="627" class="sub">Implementation: src/ui → src/server.ts → src/agent.ts ↔ src/tools.ts / src/data.ts</text>
</svg>
